<ion-content [scrollY]="false">
  <div class="dashboard-wrapper">
    
    <!-- ASIDE: Left Side Navigation Bar (Static Layout) -->
    <aside class="sidebar-container">
      <div class="brand-header">
        <h1 class="brand-title">Glaron India</h1>
        <p class="brand-subtitle">Admin Console</p>
      </div>
      
      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li *ngFor="let item of sidebarItems" 
              class="nav-item" 
              [class.active]="activeMenu === item.name"
              (click)="selectMenu(item.name)">
            <span class="nav-icon-container">
              <svg *ngIf="item.name === 'Products'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <svg *ngIf="item.name === 'Dealers'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <svg *ngIf="item.name === 'Orders'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
              </svg>
              <svg *ngIf="item.name === 'Settings'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </span>
            <span class="nav-text">{{ item.name }}</span>
          </li>
        </ul>
      </nav>
      
      <div class="sidebar-footer">
        <button class="new-order-btn" (click)="newOrder()">
          <svg class="btn-plus-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          <span class="btn-text-gold">New Order</span>
        </button>
      </div>
    </aside>
    
    <!-- HEADER: Top Navigation Bar (Static Layout) -->
    <header class="topbar-container">
      <div class="topbar-left">
        <span class="topbar-brand" (click)="logout()">Glaron India Admin</span>
        <nav class="topbar-links">
          <a href="#" class="topbar-link" (click)="$event.preventDefault(); selectMenu('Products')">Dashboard</a>
          <a href="#" class="topbar-link active" (click)="$event.preventDefault()">Analytics</a>
        </nav>
      </div>
      
      <div class="topbar-right">
        <!-- Search bar -->
        <div class="search-container">
          <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input 
            type="text" 
            [(ngModel)]="searchVal" 
            placeholder="Search..." 
            class="search-input"
          />
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons-group">
          <!-- Notification Bell -->
          <button class="icon-btn">
            <svg class="topbar-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          </button>
          
          <!-- Help Icon -->
          <button class="icon-btn">
            <svg class="topbar-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
          
          <!-- Profile Info & Avatar -->
          <div class="profile-details-wrapper" (click)="logout()" title="Logout Admin">
            <div class="profile-text-info">
              <span class="user-name">Admin User</span>
              <span class="user-role">Operations</span>
            </div>
            <div class="profile-avatar-container">
              <div class="avatar-fallback-box border-gold">
                <svg class="avatar-icon" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    
    <!-- MAIN ROUTER OUTLET CONTAINER -->
    <div class="main-outlet-container">
      <ion-router-outlet></ion-router-outlet>
    </div>
    
  </div>
</ion-content>
