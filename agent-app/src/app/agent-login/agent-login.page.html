<ion-content [scrollY]="true">
  <div class="auth-screen">

    <!-- Branded hero header -->
    <header class="auth-hero">
      <div class="hero-orb orb-1"></div>
      <div class="hero-orb orb-2"></div>
      <div class="hero-inner">
        <img src="assets/glaron-logo-white.png" alt="Glaron India" class="hero-logo" />
        <!-- Names the app outright: an agent with the dealer portal installed
             too must never have to guess which one they just opened. -->
        <span class="hero-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/>
          </svg>
          Agent App
        </span>
        <h1 class="hero-welcome">Welcome back 👋</h1>
        <p class="hero-sub">Sign in with your agent number and password</p>
      </div>
      <div class="hero-curve"></div>
    </header>

    <!-- Card sheet -->
    <main class="auth-sheet">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>

        <!-- Global feedback -->
        <div *ngIf="errorMessage" class="g-alert g-alert--error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="g-alert-ic"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <span>{{ errorMessage }}</span>
        </div>
        <div *ngIf="successMessage" class="g-alert g-alert--success" role="status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="g-alert-ic"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          <span>{{ successMessage }}</span>
        </div>

        <!-- Mobile number -->
        <div class="g-field">
          <label class="g-label" for="agent-mobile">Mobile number</label>
          <div class="g-input-wrap" [class.is-invalid]="loginForm.get('mobile')?.touched && loginForm.get('mobile')?.invalid">
            <span class="g-input-prefix">+91</span>
            <input id="agent-mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" formControlName="mobile" (input)="onMobileInput($any($event.target).value)" placeholder="10-digit mobile number" class="g-input" />
          </div>
          <span class="g-field-err" *ngIf="loginForm.get('mobile')?.touched && loginForm.get('mobile')?.invalid">
            Please enter a valid 10-digit mobile number.
          </span>
        </div>

        <!-- Password -->
        <div class="g-field">
          <label class="g-label" for="agent-password">Password</label>
          <div class="g-input-wrap" [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="g-input-ic">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input id="agent-password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" formControlName="password" placeholder="Enter your password" class="g-input" />
            <button type="button" class="g-input-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a9.957 9.957 0 013.682-.763c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-6.165-3.666a3 3 0 104.243-4.243M3 3l18 18"/></svg>
            </button>
          </div>
          <span class="g-field-err" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            Password must be at least 6 characters.
          </span>
        </div>

        <!-- Options row -->
        <div class="auth-options">
          <label class="g-checkbox">
            <input type="checkbox" formControlName="rememberMe" />
            <span class="g-checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </span>
            <span class="g-checkbox-text">Remember me</span>
          </label>
          <a class="auth-link" (click)="onForgotPassword()">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="g-btn g-btn--primary auth-submit" [disabled]="isLoading" [class.is-loading]="isLoading">
          <span class="g-btn-spinner" *ngIf="isLoading"></span>
          <span>{{ isLoading ? 'Signing in…' : 'Sign In' }}</span>
        </button>
      </form>

      <!-- Agents cannot self-register: the account is handed to them. -->
      <div class="auth-foot">
        <span>Don't have an account? Ask the Glaron team.</span>
      </div>

      <p class="app-version">v{{ appVersion }}</p>
    </main>
  </div>
</ion-content>
