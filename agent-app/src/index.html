<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Glaron India - Agent App</title>

  <base href="/" />

  <!-- Light only. The app has no dark palette, so advertising "dark" just
       invited the browser to darken native controls on top of a light UI. -->
  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- PWA Web App Meta -->
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Glaron Agent" />

  <!-- Manifest & Favicons. The agent app has its OWN icon set (teal + "AGENT")
       under assets/agent — pointing these at the shared assets/icon is what put
       an identical tile to the dealer portal's on the home screen. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/agent/icon-192.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="assets/agent/favicon.png" />
  <link rel="apple-touch-icon" href="assets/agent/apple-touch-icon.png" />

  <!-- PWA install prompt capture. Chrome fires `beforeinstallprompt` long before
       Angular boots, so it is stashed here and replayed by the install screen. -->
  <script>
    window.__glaronAgentInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__glaronAgentInstallPrompt = e;
      window.dispatchEvent(new Event('glaron-agent-install-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__glaronAgentInstallPrompt = null;
      window.dispatchEvent(new Event('glaron-agent-installed'));
    });
  </script>

  <!-- Branded splash (shown until Angular boots) -->
  <style>
    /* Teal only while the splash owns the screen. Angular adds `booted` once
       the splash starts fading — without that the teal stayed on <html> for
       the life of the session and showed through on overscroll.
       Teal, not the dealer portal's purple: the agent app is a separate install
       and must not look like the dealer one from the very first frame. */
    html { background: #04262A; }
    html.booted { background: #FCF9F8; }
    #app-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(120% 120% at 50% 0%, #0F5C56 0%, #08423F 46%, #04262A 100%);
      transition: opacity .4s ease;
    }
    #app-splash.hide { opacity: 0; pointer-events: none; }
    #app-splash .splash-box { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    #app-splash .splash-logo { width: min(340px, 74vw); height: auto; display: block; animation: splashPop .6s ease both; }
    #app-splash .splash-tag { color: rgba(255,255,255,.55); font: 600 12px/1 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; }
    #app-splash .splash-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.22); border-top-color: #F5941D; border-radius: 50%; animation: splashSpin .8s linear infinite; }
    @keyframes splashSpin { to { transform: rotate(360deg); } }
    @keyframes splashPop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>

  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body>
  <app-root></app-root>

  <!-- Splash overlay: removed by main.ts once the app has bootstrapped -->
  <div id="app-splash">
    <div class="splash-box">
      <img src="assets/glaron-logo-white.png" alt="Glaron India" class="splash-logo" />
      <div class="splash-tag">Agent App</div>
      <div class="splash-spinner"></div>
    </div>
  </div>
  <script>
    // Safety fallback: never let the splash trap the user if bootstrap stalls.
    setTimeout(function () {
      var s = document.getElementById('app-splash');
      if (s) { document.documentElement.classList.add('booted'); s.classList.add('hide'); setTimeout(function () { s.remove(); }, 450); }
    }, 8000);
  </script>
</body>

</html>
