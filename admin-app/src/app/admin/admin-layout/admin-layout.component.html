<ion-content [scrollY]="false">
  <div class="dashboard-wrapper" [class.sidebar-open]="sidebarOpen">

    <!-- Tap-away layer behind the mobile drawer. Desktop never renders it. -->
    <div class="sidebar-scrim" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>

    <!-- ASIDE: Left Side Navigation Bar (a fixed column on desktop, a drawer
         over the content on mobile) -->
    <aside class="sidebar-container" [class.open]="sidebarOpen">
      <div class="brand-header">
        <img src="assets/glaron-logo-dark.png" alt="Glaron India" class="sidebar-logo" />
      </div>
      
      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li *ngFor="let item of sidebarItems" 
              class="nav-item" 
              [class.active]="activeMenu === item.name"
              (click)="selectMenu(item.name)">
            <span class="nav-icon-container">
              <svg *ngIf="item.name === 'Home'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <svg *ngIf="item.name === 'Categories'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
              </svg>
              <svg *ngIf="item.name === 'Products'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <svg *ngIf="item.name === 'Dealers'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <svg *ngIf="item.name === 'Agents'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V8a2 2 0 00-2-2h-4m-4 0V5a2 2 0 012-2h0a2 2 0 012 2v1m-4 0h4m-2 5a2 2 0 110 4 2 2 0 010-4zm-3.2 7c0-1.33 2.13-2 3.2-2s3.2.67 3.2 2" />
              </svg>
              <svg *ngIf="item.name === 'Orders'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
              </svg>
              <svg *ngIf="item.name === 'Request Quotation'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h4m4-11H7a2 2 0 00-2 2v13l3.5-2.5L12 20l3.5-2.5L19 20V7a2 2 0 00-2-2z" />
              </svg>
              <svg *ngIf="item.name === 'Area Quotation'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10M9 21v-6h6v6" />
              </svg>
              <svg *ngIf="item.name === 'Compare Quotation'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10h6m-6 0V7m6 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
              </svg>
              <svg *ngIf="item.name === 'Offer Banners'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5a1.99 1.99 0 011.414.586l7 7a2 2 0 010 2.828l-5 5a2 2 0 01-2.828 0l-7-7A1.99 1.99 0 015 12V7a4 4 0 014-4z" />
              </svg>
              <svg *ngIf="item.name === 'Notifications'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <svg *ngIf="item.name === 'Posts'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <svg *ngIf="item.name === 'Activity Logs'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-6m3 6V7m3 10v-4M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <svg *ngIf="item.name === 'Share Catalogue'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342a3 3 0 100-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684zm0-12.632a3 3 0 105.368-2.684 3 3 0 00-5.368 2.684z" />
              </svg>
              <svg *ngIf="item.name === 'Share Catalogue (Area)'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h7v7H4V4zm9 0h7v4h-7V4zm0 6h7v10h-7V10zM4 13h7v7H4v-7z" />
              </svg>
              <svg *ngIf="item.name === 'Settings'" class="nav-svg-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </span>
            <span class="nav-text">{{ item.name }}</span>
          </li>
        </ul>
      </nav>
      
    </aside>
    
    <!-- HEADER: Top Navigation Bar -->
    <header class="topbar-container" [class.search-open]="searchOpen">
      <div class="topbar-left">
        <!-- Drawer toggle. Mobile only; the sidebar is always visible above the
             breakpoint, so a menu button there would do nothing. -->
        <!-- One navigation slot, as on every phone: a detail screen shows Back
             there instead of the drawer toggle. The drawer is still reachable
             once Back has returned to the list. -->
        <button
          *ngIf="!backTarget"
          class="menu-btn"
          (click)="toggleSidebar()"
          [attr.aria-expanded]="sidebarOpen"
          aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path *ngIf="!sidebarOpen" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="sidebarOpen" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <!-- Back. Only on screens that sit under a list, and only where the
             sidebar is not on screen to serve as the way out. An installed
             PWA has no browser back of its own, so without this a detail
             screen on a phone is a dead end. -->
        <button
          *ngIf="backTarget"
          class="back-btn"
          (click)="goBack()"
          aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <nav class="topbar-breadcrumb" aria-label="Breadcrumb">
          <span class="crumb-root">Dashboard</span>
          <svg class="crumb-sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
          <span class="crumb-current">{{ activeMenu }}</span>
        </nav>
      </div>

      <div class="topbar-right">
        <!-- Search. A permanent field on desktop; on mobile there isn't room
             beside the title, so it hides behind the icon below and takes over
             the bar when opened. -->
        <div class="search-container">
          <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            type="text"
            [(ngModel)]="searchVal"
            placeholder="Search..."
            class="search-input"
          />
        </div>

        <button
          class="icon-btn search-toggle"
          (click)="toggleSearch()"
          [attr.aria-label]="searchOpen ? 'Close search' : 'Search'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path *ngIf="!searchOpen" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            <path *ngIf="searchOpen" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <!-- Action Buttons -->
        <div class="action-buttons-group">
          <!-- Profile Avatar Button with Dropdown Sign Out -->
          <div class="profile-details-wrapper" style="position: relative;">
            <div class="profile-avatar-container" (click)="toggleProfileMenu()" style="cursor: pointer;" title="Admin Profile">
              <div class="avatar-fallback-box border-gold">
                <svg class="avatar-icon" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                </svg>
              </div>
            </div>

            <!-- Profile Dropdown Menu -->
            <div *ngIf="showProfileMenu" class="profile-dropdown-menu">
              <button class="signout-item-btn" (click)="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon-svg">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
    
    <!-- MAIN ROUTER OUTLET CONTAINER -->
    <div class="main-outlet-container">
      <!-- Order alerts are off on this device: without them a new dealer order
           only shows up if someone is looking at the console. -->
      <div class="alert-optin" *ngIf="showAlertBanner">
        <svg class="alert-optin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <div class="alert-optin-text">
          <strong>Turn on order alerts</strong>
          <span *ngIf="!needsInstallFirst">Get a notification the moment a dealer places an order — even when this app is closed.</span>
          <span *ngIf="needsInstallFirst">On iPhone and iPad, add the console to your Home Screen first.</span>
        </div>
        <button class="alert-optin-btn" (click)="enableAlerts()" [disabled]="enablingAlerts">
          {{ needsInstallFirst ? 'Show me how' : (enablingAlerts ? 'Requesting…' : 'Turn on') }}
        </button>
        <button class="alert-optin-close" (click)="dismissAlertBanner()" aria-label="Dismiss">×</button>
      </div>

      <ion-router-outlet></ion-router-outlet>
    </div>
    
  </div>
</ion-content>
