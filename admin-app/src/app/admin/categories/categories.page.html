<ion-content [scrollY]="true">
  <main class="content-canvas">

    <!-- Page Header -->
    <div class="page-header-row">
      <div class="title-container">
        <h2 class="page-title">Categories</h2>
      </div>

      <button class="add-product-btn" (click)="addCategory()">
        <svg class="btn-plus-white-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        <span class="btn-text-white">Add Categories</span>
      </button>
    </div>

    <!-- Category listing table -->
    <section class="table-section-card">
      <table class="inventory-table compact">
        <thead>
          <tr>
            <th class="th-preview">Image</th>
            <th class="th-name">Category Name</th>
            <th class="th-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of categories; let last = last; trackBy: trackByCategoryId" [class.last-row-border]="last">

            <!-- Image Cell -->
            <td class="td-preview">
              <div class="product-preview-box" [class.no-image]="!category.image">
                <img *ngIf="category.image" [src]="category.image" (error)="onImgError($event)" class="product-preview-img-file" [alt]="category.name" loading="lazy" decoding="async" />
                <span *ngIf="!category.image" class="no-image-label">No Image</span>
              </div>
            </td>

            <!-- Name Cell -->
            <td class="td-name">
              <span class="product-name">{{ category.name }}</span>
            </td>

            <!-- Actions Cell -->
            <td class="td-actions">
              <div class="actions-group">
                <button class="edit-btn" (click)="editCategory(category)">
                  <svg class="edit-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                  </svg>
                  <span class="edit-btn-text">Edit</span>
                </button>
                <button class="delete-btn" (click)="deleteCategory(category, $event)" title="Delete category">
                  <svg class="delete-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                  <span class="delete-btn-text">Delete</span>
                </button>
              </div>
            </td>
          </tr>

          <!-- Empty state -->
          <tr *ngIf="categories.length === 0">
            <td colspan="3" class="td-empty">
              No categories yet. Click "Add Categories" to create your first one.
            </td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>
</ion-content>
