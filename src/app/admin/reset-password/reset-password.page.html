<ion-content [scrollY]="false">
  <div class="login-wrapper">

    <!-- Background Atmospheric Lighting Elements -->
    <div class="atmospheric-glow"></div>
    <div class="blur-blob blur-blob-1"></div>
    <div class="blur-blob blur-blob-2"></div>

    <div class="login-container">

      <!-- Brand Identity Section -->
      <header class="brand-section">
        <div class="logo-container">
          <img src="assets/glaron-logo-dark.png" alt="Glaron India" class="brand-logo-full" />
        </div>

        <div class="text-container">
          <h1 class="heading">Set New Password</h1>
          <p class="subtitle" *ngIf="accountEmail && !successMessage">for {{ accountEmail }}</p>
          <p class="subtitle" *ngIf="!accountEmail">Admin Console Access</p>
        </div>
      </header>

      <!-- Section - Reset Form Card -->
      <main class="login-card">

        <!-- Verifying state -->
        <div class="verify-state" *ngIf="isVerifying">
          <ion-spinner name="crescent" class="verify-spinner"></ion-spinner>
          <span class="verify-text">Verifying your reset link...</span>
        </div>

        <ng-container *ngIf="!isVerifying">
          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="login-form">

            <!-- Success Alert -->
            <div class="success-alert" *ngIf="successMessage">
              <svg class="success-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>{{ successMessage }}</span>
            </div>

            <!-- Error Alert -->
            <div class="error-alert" *ngIf="errorMessage">
              <svg class="error-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <span>{{ errorMessage }}</span>
            </div>

            <!-- New Password Field -->
            <div class="form-field" *ngIf="!errorMessage || successMessage">
              <div class="label-container">
                <label for="password" class="field-label">New Password <span class="req-star">*</span></label>
              </div>
              <div class="input-wrapper" [ngClass]="{'input-error': resetForm.get('password')?.touched && resetForm.get('password')?.invalid}">
                <div class="icon-container-left">
                  <svg class="field-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input
                  id="password"
                  [type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  placeholder="Enter new password"
                  class="form-input"
                  autocomplete="new-password"
                />
                <button type="button" class="eye-button" (click)="togglePassword()">
                  <svg class="field-icon-eye" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path *ngIf="!showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    <path *ngIf="showPassword" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                  </svg>
                </button>
              </div>
              <span class="field-hint">Must be at least 6 characters.</span>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-field" *ngIf="!errorMessage || successMessage">
              <div class="label-container">
                <label for="confirmPassword" class="field-label">Confirm Password <span class="req-star">*</span></label>
              </div>
              <div class="input-wrapper" [ngClass]="{'input-error': (resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid) || (resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched)}">
                <div class="icon-container-left">
                  <svg class="field-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input
                  id="confirmPassword"
                  [type]="showConfirm ? 'text' : 'password'"
                  formControlName="confirmPassword"
                  placeholder="Re-enter new password"
                  class="form-input"
                  autocomplete="new-password"
                />
                <button type="button" class="eye-button" (click)="toggleConfirm()">
                  <svg class="field-icon-eye" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path *ngIf="!showConfirm" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    <path *ngIf="showConfirm" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                  </svg>
                </button>
              </div>
              <span class="field-error-text" *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched">Passwords do not match.</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-button" [disabled]="isLoading || !!successMessage" *ngIf="!errorMessage || successMessage">
              <span *ngIf="!isLoading" class="btn-text">Reset Password</span>
              <ion-spinner name="crescent" color="light" class="spinner" *ngIf="isLoading"></ion-spinner>
            </button>
          </form>
        </ng-container>

        <!-- Secondary Links -->
        <div class="secondary-links">
          <p class="auth-paragraph">
            <a href="#" class="request-link" (click)="$event.preventDefault(); backToLogin()">Back to Sign In</a>
          </p>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer-section">
        <div class="footer-links-row">
          <a href="#" class="footer-link" (click)="$event.preventDefault()">Privacy Policy</a>
          <a href="#" class="footer-link" (click)="$event.preventDefault()">Terms of Service</a>
          <a href="#" class="footer-link" (click)="$event.preventDefault()">Help Center</a>
        </div>
        <p class="copyright-text">© 2024 Glaron India Lighting Solutions</p>
      </footer>

    </div>
  </div>
</ion-content>
