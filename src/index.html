<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Glaron India</title>

  <base href="/" />

  <!-- Light only. The portal has no dark palette, so advertising "dark" just
       invited the browser to darken native controls on top of a light UI. -->
  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Link preview. The catalogue link is pasted into chats, where a bare URL
       shows as a grey strip — these give it a title, a line of copy and the
       Glaron mark instead. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Glaron India" />
  <meta property="og:title" content="Glaron India — The Lighting Catalogue" />
  <meta property="og:description" content="Designer lights, profiles and fixtures — the complete Glaron India range, always up to date." />
  <meta property="og:image" content="https://glaron-dealer.web.app/assets/icon/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="description" content="Designer lights, profiles and fixtures — the complete Glaron India range, always up to date." />

  <!-- PWA Web App Meta -->
  <!-- Matches the app bar so the installed app has no dark band above it. The
       launch splash keeps its purple via the manifest's background_color. -->
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- `default`, not `black-translucent`: translucent draws the iOS clock and
       battery in white directly over the page, and the dealer app bar is a
       near-white frosted strip — they disappeared against it. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Glaron India" />

  <!-- Manifest & Favicons -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />

  <!-- PWA install prompt capture. Chrome fires `beforeinstallprompt` long before
       Angular boots, so it is stashed here and replayed by the install screen. -->
  <script>
    window.__glaronInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__glaronInstallPrompt = e;
      window.dispatchEvent(new Event('glaron-install-ready'));
    });
    window.addEventListener('appinstalled', function () {
      window.__glaronInstallPrompt = null;
      window.dispatchEvent(new Event('glaron-app-installed'));
    });
  </script>

  <!-- Branded splash (shown until Angular boots) -->
  <style>
    /* Purple only while the splash owns the screen. Angular adds `booted` once
       the splash starts fading — without that the purple stayed on <html> for
       the life of the session and showed through on overscroll and anywhere the
       app's own background did not reach. */
    html { background: #170338; }
    html.booted { background: #FCF9F8; }
    #app-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: #170338; transition: opacity .4s ease;
    }
    #app-splash.hide { opacity: 0; pointer-events: none; }
    #app-splash .splash-box { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    #app-splash .splash-logo { width: min(340px, 74vw); height: auto; display: block; animation: splashPop .6s ease both; }
    #app-splash .splash-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,.22); border-top-color: #F5941D; border-radius: 50%; animation: splashSpin .8s linear infinite; }
    @keyframes splashSpin { to { transform: rotate(360deg); } }
    @keyframes splashPop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>

  <!-- Google Fonts - Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body>
  <app-root></app-root>

  <!-- Splash overlay: removed by main.ts once the app has bootstrapped -->
  <div id="app-splash">
    <div class="splash-box">
      <img src="assets/glaron-logo-white.png" alt="Glaron India" class="splash-logo" />
      <div class="splash-spinner"></div>
    </div>
  </div>
  <script>
    // Safety fallback: never let the splash trap the user if bootstrap stalls.
    setTimeout(function () {
      var s = document.getElementById('app-splash');
      if (s) { document.documentElement.classList.add('booted'); s.classList.add('hide'); setTimeout(function () { s.remove(); }, 450); }
    }, 8000);
  </script>
</body>

</html>
